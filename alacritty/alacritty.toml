# Rewritten by alacritty/theme-sync.sh to follow the macOS light/dark
# appearance; alacritty live-reloads when it changes. Values set here in
# alacritty.toml win over the import, so anything the theme owns — colors,
# decorations_theme_variant — must not also be set below.
#
# Imports merge in order, later ones winning, and this file wins over all of
# them. So the font size lives in font.toml rather than below, where local.toml
# -- an optional per-machine file, linked in from ~/Code/machines when that
# repo has one for this host -- can still override it. A missing import is
# skipped, not an error.
[general]
import = [
  "~/.config/alacritty/theme.toml",
  "~/.config/alacritty/font.toml",
  "~/.config/alacritty/local.toml",
]

[font.normal]
family = "JetBrainsMono Nerd Font Mono"

[env]
TERM = "xterm-256color"

[window]
padding.x = 10
padding.y = 10

opacity = 0.9
blur = true

option_as_alt = "Both"

# macOS draws the tab bar natively; decorations_theme_variant is the only way
# to affect it, so light.toml and dark.toml each set their own.

[[keyboard.bindings]]
key = "Return"
mods = "Shift"
chars = "\u001b[13;2u"

# Cmd-C / Cmd-V everywhere: Alacritty calls Cmd "Super", so on macOS these are
# its defaults restated, and on Linux they add the Mac chord beside
# Ctrl+Shift+C/V. Paste is text only -- an image still goes into Claude Code
# with Ctrl+V, which reads the clipboard itself.
[[keyboard.bindings]]
key = "C"
mods = "Super"
action = "Copy"

[[keyboard.bindings]]
key = "V"
mods = "Super"
action = "Paste"

