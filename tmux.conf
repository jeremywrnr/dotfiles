# jeremy warner
# tmux.conf

# key bindings
unbind r
unbind C-b
bind x send-prefix
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind r source-file ~/.tmux.conf
bind c new-window -c "#{pane_current_path}"
bind - split-window -c "#{pane_current_path}"
bind | split-window -h -c "#{pane_current_path}"

# direct window switching, no prefix (needs extended-keys, set below)
bind -n C-1 select-window -t 1
bind -n C-2 select-window -t 2
bind -n C-3 select-window -t 3
bind -n C-4 select-window -t 4
bind -n C-5 select-window -t 5
bind -n C-6 select-window -t 6
bind -n C-7 select-window -t 7
bind -n C-8 select-window -t 8
bind -n C-9 select-window -t 9
bind -n C-M-j next-window
bind -n C-M-k previous-window

# Status bar design
set -g status-justify left
set-option -g default-shell /bin/zsh
set -g status-style 'bg=default,fg=colour12'
set -g status-left ''
set -g status-right '%H:%M:%S %m/%d'
setw -g window-status-format " #W"
setw -g window-status-current-format " #F#[fg=colour45]#W"

# scroll a pane
set -g mouse on
setw -g automatic-rename on
setw -g aggressive-resize on

# Plugin list
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-open'

# better defaults
set -g prefix C-x
set -s extended-keys on
set -g base-index 1
set -g history-limit 100000
set -g update-environment -r

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf).
# Guarded so a box without tpm cloned starts clean instead of erroring; install
# it with: git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm
if-shell 'test -x ~/.tmux/plugins/tpm/tpm' "run '~/.tmux/plugins/tpm/tpm'"

